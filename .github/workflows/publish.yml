name: Publish release

# Publishes the signed APK in release/ as a GitHub release.
# The APK is built and signed outside CI; bump release/version.txt with each new APK.
on:
  push:
    branches: [main]
    paths: ["release/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d '[:space:]' < release/version.txt)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/xe-launcher.apk --clobber
          else
            gh release create "$TAG" release/xe-launcher.apk \
              --title "Xe Launcher $TAG" --notes-file release/notes.md --latest
          fi
