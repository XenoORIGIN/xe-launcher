name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["website/**", "docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xe-release.jks"
            echo "XE_KEYSTORE_PATH=$RUNNER_TEMP/xe-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Test and build
        env:
          XE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          XE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/release/xe-launcher.apk \
            --title "Xe Launcher $TAG" \
            --notes "Build ${{ github.run_number }} from ${GITHUB_SHA::7}" \
            --latest
