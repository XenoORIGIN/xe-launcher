name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["Publish release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The site lives at the root; the old /website/ link forwards there.
      - run: |
          mkdir -p _site/website && cp -r website/. _site/
          printf '<!doctype html><meta charset="utf-8"><title>Xe Launcher</title><meta http-equiv="refresh" content="0; url=../"><script>location.replace("../"+location.hash)</script><a href="../">Xe Launcher</a>' > _site/website/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
